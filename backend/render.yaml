services:
  - type: web
    name: luxeliving-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: luxeliving-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATA_DIR
        value: /data
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_NAME
        value: Priya Sharma
      - key: ADMIN_EMAIL
        value: admin@luxeliving.in
      - key: ADMIN_PASSWORD
        sync: false
